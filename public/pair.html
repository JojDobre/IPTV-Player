<!doctype html>
<!-- Opened on a phone from the QR code the TV shows. Sends the playlist to the TV over the home network;
     the TV's app (or the PC server) only accepts it with the one-time code in the address. -->
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OnAir – pridať playlist</title>
<style>
  :root { color-scheme: dark; --bg: #0b0b14; --card: #15152a; --line: #2a2a46; --fg: #ececf6; --muted: #9c9cbb; --acc: #6d6bff; }
  * { box-sizing: border-box; }
  body { margin: 0; background: radial-gradient(120% 60% at 0% 0%, #241b5e, var(--bg) 60%) fixed; color: var(--fg); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: 28px 18px 48px; }
  .logo { display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 22px; margin-bottom: 18px; }
  .logo b { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: linear-gradient(135deg, #7C5CFF, #4F7BFF 52%, #2EC5FF); }
  h1 { font-size: 22px; margin: 0 0 6px; }
  p { color: var(--muted); margin: 0 0 18px; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 4px; border-radius: 14px; background: var(--card); margin-bottom: 16px; }
  .seg button { border: 0; border-radius: 10px; padding: 10px; background: transparent; color: var(--muted); font: inherit; font-weight: 600; }
  .seg button.on { background: var(--fg); color: #0b0b14; }
  label { display: block; font-size: 14px; color: var(--muted); margin: 14px 0 6px; }
  input { width: 100%; padding: 13px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--fg); font: inherit; }
  input:focus { outline: 2px solid var(--acc); border-color: transparent; }
  .go { width: 100%; margin-top: 22px; padding: 15px; border: 0; border-radius: 14px; background: var(--fg); color: #0b0b14; font: inherit; font-weight: 700; font-size: 17px; }
  .go:disabled { opacity: .5; }
  .msg { margin-top: 16px; padding: 14px; border-radius: 12px; background: var(--card); display: none; }
  .msg.on { display: block; }
  .msg.err { color: #ff9a9a; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="logo"><b><svg viewBox="0 0 100 100" width="28" height="28" aria-hidden="true"><g fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"><path d="M66.97 33.03a24 24 0 0 1 0 33.94M33.03 66.97a24 24 0 0 1 0-33.94M76.87 23.13a38 38 0 0 1 0 53.74M23.13 76.87a38 38 0 0 1 0-53.74"/></g><circle cx="50" cy="50" r="10" fill="#fff"/></svg></b>OnAir</div>
  <h1 data-t="title">Pridať playlist do TV</h1>
  <p data-t="lead">Údaje sa pošlú len do tvojho TV v domácej sieti.</p>
  <div class="seg"><button type="button" class="on" data-v="m3u" data-t="m3u">M3U odkaz</button><button type="button" data-v="xt">Xtream Codes</button></div>
  <form id="f">
    <label for="name" data-t="name">Názov</label><input id="name" autocomplete="off" placeholder="Môj IPTV">
    <div id="m3u">
      <label for="url" data-t="url">Adresa playlistu (M3U)</label><input id="url" type="url" inputmode="url" autocomplete="off" spellcheck="false" placeholder="http://…">
    </div>
    <div id="xt" hidden>
      <label for="server">Server</label><input id="server" inputmode="url" autocomplete="off" spellcheck="false" placeholder="http://server:8080">
      <label for="user" data-t="user">Používateľ</label><input id="user" autocomplete="off" spellcheck="false">
      <label for="pass" data-t="pass">Heslo</label><input id="pass" type="password" autocomplete="off">
    </div>
    <label for="epg" data-t="epg">Program EPG (nepovinné)</label><input id="epg" inputmode="url" autocomplete="off" spellcheck="false" placeholder="http://…/epg.xml.gz">
    <button class="go" id="go" data-t="send">Poslať do TV</button>
  </form>
  <div class="msg" id="msg"></div>
</main>
<script>
  // Phone browser language (the app's own setting is not visible here). Fallback English.
  const K = ['title','lead','m3u','name','url','user','pass','epg','send','ph','sTitle','sLead','eUrl','eXt','eExp','done'];
  const L = {
    sk: ['Pridať playlist do TV','Údaje sa pošlú len do tvojho TV v domácej sieti.','M3U odkaz','Názov','Adresa playlistu (M3U)','Používateľ','Heslo','Program EPG (nepovinné)','Poslať do TV','Môj IPTV','Tento kód patrí do appky OnAir','V mobile otvor appku OnAir: Nastavenia → Preniesť na iné zariadenie → Naskenovať QR kód a nasmeruj ho znova na TV.','Adresa musí začínať http:// alebo https://','Vyplň server, meno aj heslo.','Kód už neplatí. Na TV otvor QR kód znova.','Hotovo. TV práve načítava playlist.'],
    en: ['Add a playlist to your TV','The details go only to your TV on your home network.','M3U link','Name','Playlist address (M3U)','User name','Password','Programme guide EPG (optional)','Send to TV','My IPTV','Open this code in OnAir','In OnAir on your phone: Settings → Transfer to another device → Scan QR code, and point it at the TV again.','The address must start with http:// or https://','Fill in the server, user name and password.','This code has expired. Open the QR code on the TV again.','Done. The TV is loading the playlist now.'],
    cs: ['Přidat playlist do TV','Údaje se pošlou jen do tvé TV v domácí síti.','Odkaz M3U','Název','Adresa playlistu (M3U)','Uživatel','Heslo','Program EPG (nepovinné)','Poslat do TV','Moje IPTV','Tento kód patří do aplikace OnAir','V mobilu otevři OnAir: Nastavení → Přenést na jiné zařízení → Naskenovat QR kód a namiř ho znovu na TV.','Adresa musí začínat http:// nebo https://','Vyplň server, jméno i heslo.','Kód už neplatí. Na TV otevři QR kód znovu.','Hotovo. TV právě načítá playlist.'],
    de: ['Playlist zum Fernseher hinzufügen','Die Daten gehen nur an deinen Fernseher im Heimnetz.','M3U-Link','Name','Playlist-Adresse (M3U)','Benutzername','Passwort','Programm-EPG (optional)','An den Fernseher senden','Mein IPTV','Dieser Code gehört in die OnAir-App','Öffne OnAir auf dem Handy: Einstellungen → Auf anderes Gerät übertragen → QR-Code scannen und richte es erneut auf den Fernseher.','Die Adresse muss mit http:// oder https:// beginnen','Server, Benutzername und Passwort ausfüllen.','Der Code ist abgelaufen. Öffne den QR-Code am Fernseher erneut.','Fertig. Der Fernseher lädt jetzt die Playlist.'],
    pl: ['Dodaj playlistę do TV','Dane trafią tylko do twojego telewizora w sieci domowej.','Link M3U','Nazwa','Adres playlisty (M3U)','Użytkownik','Hasło','Program EPG (opcjonalnie)','Wyślij do TV','Moje IPTV','Ten kod jest dla aplikacji OnAir','Otwórz OnAir w telefonie: Ustawienia → Przenieś na inne urządzenie → Zeskanuj kod QR i skieruj go ponownie na telewizor.','Adres musi zaczynać się od http:// lub https://','Uzupełnij serwer, nazwę użytkownika i hasło.','Kod wygasł. Otwórz kod QR na telewizorze ponownie.','Gotowe. Telewizor wczytuje teraz playlistę.'],
    hu: ['Lejátszási lista hozzáadása a TV-hez','Az adatok csak a TV-dre kerülnek az otthoni hálózaton.','M3U link','Név','Lista címe (M3U)','Felhasználónév','Jelszó','Műsorújság EPG (nem kötelező)','Küldés a TV-re','Saját IPTV','Ez a kód az OnAir alkalmazásba való','Nyisd meg az OnAir-t a telefonon: Beállítások → Átvitel másik eszközre → QR-kód beolvasása, és irányítsd újra a TV-re.','A címnek http:// vagy https:// előtaggal kell kezdődnie','Add meg a szervert, a felhasználónevet és a jelszót.','A kód lejárt. Nyisd meg újra a QR-kódot a TV-n.','Kész. A TV most tölti be a listát.'],
    es: ['Añadir una lista a la TV','Los datos solo se envían a tu TV en la red de casa.','Enlace M3U','Nombre','Dirección de la lista (M3U)','Usuario','Contraseña','Guía EPG (opcional)','Enviar a la TV','Mi IPTV','Este código es para la app OnAir','En OnAir en tu móvil: Ajustes → Transferir a otro dispositivo → Escanear código QR, y apunta de nuevo a la TV.','La dirección debe empezar por http:// o https://','Rellena el servidor, el usuario y la contraseña.','El código ha caducado. Abre de nuevo el código QR en la TV.','Listo. La TV está cargando la lista.'],
    fr: ['Ajouter une playlist à la TV','Les données sont envoyées uniquement à ta TV sur le réseau domestique.','Lien M3U','Nom','Adresse de la playlist (M3U)','Utilisateur','Mot de passe','Guide EPG (facultatif)','Envoyer à la TV','Mon IPTV','Ce code est destiné à l’app OnAir','Dans OnAir sur ton téléphone : Réglages → Transférer vers un autre appareil → Scanner un code QR, puis vise à nouveau la TV.','L’adresse doit commencer par http:// ou https://','Remplis le serveur, l’utilisateur et le mot de passe.','Le code a expiré. Rouvre le code QR sur la TV.','C’est fait. La TV charge la playlist.'],
    it: ['Aggiungi una playlist alla TV','I dati vengono inviati solo alla tua TV sulla rete di casa.','Link M3U','Nome','Indirizzo della playlist (M3U)','Utente','Password','Guida EPG (facoltativa)','Invia alla TV','La mia IPTV','Questo codice è per l’app OnAir','In OnAir sul telefono: Impostazioni → Trasferisci su un altro dispositivo → Scansiona codice QR, e inquadra di nuovo la TV.','L’indirizzo deve iniziare con http:// o https://','Compila server, utente e password.','Il codice è scaduto. Riapri il codice QR sulla TV.','Fatto. La TV sta caricando la playlist.'],
    pt: ['Adicionar uma lista à TV','Os dados vão apenas para a tua TV na rede de casa.','Link M3U','Nome','Endereço da lista (M3U)','Utilizador','Palavra-passe','Guia EPG (opcional)','Enviar para a TV','A minha IPTV','Este código é para a app OnAir','Na app OnAir do telemóvel: Definições → Transferir para outro dispositivo → Ler código QR, e aponta de novo para a TV.','O endereço tem de começar por http:// ou https://','Preenche o servidor, o utilizador e a palavra-passe.','O código expirou. Abre de novo o código QR na TV.','Pronto. A TV está a carregar a lista.'],
    ru: ['Добавить плейлист на ТВ','Данные отправляются только на ваш телевизор в домашней сети.','Ссылка M3U','Название','Адрес плейлиста (M3U)','Имя пользователя','Пароль','Телепрограмма EPG (необязательно)','Отправить на ТВ','Моё IPTV','Этот код для приложения OnAir','Откройте OnAir на телефоне: Настройки → Перенести на другое устройство → Сканировать QR-код и снова наведите на телевизор.','Адрес должен начинаться с http:// или https://','Заполните сервер, имя пользователя и пароль.','Срок действия кода истёк. Снова откройте QR-код на телевизоре.','Готово. Телевизор загружает плейлист.'],
    uk: ['Додати плейлист на ТВ','Дані надсилаються лише на ваш телевізор у домашній мережі.','Посилання M3U','Назва','Адреса плейлиста (M3U)','Ім’я користувача','Пароль','Телепрограма EPG (необов’язково)','Надіслати на ТВ','Моє IPTV','Цей код для застосунку OnAir','Відкрийте OnAir на телефоні: Налаштування → Перенести на інший пристрій → Сканувати QR-код і знову наведіть на телевізор.','Адреса має починатися з http:// або https://','Заповніть сервер, ім’я користувача і пароль.','Термін дії коду минув. Знову відкрийте QR-код на телевізорі.','Готово. Телевізор завантажує плейлист.'],
    tr: ['TV’ye çalma listesi ekle','Bilgiler yalnızca ev ağındaki TV’ne gönderilir.','M3U bağlantısı','Ad','Liste adresi (M3U)','Kullanıcı adı','Şifre','Yayın akışı EPG (isteğe bağlı)','TV’ye gönder','IPTV’m','Bu kod OnAir uygulaması içindir','Telefonda OnAir’i aç: Ayarlar → Başka bir cihaza aktar → QR kodu tara ve TV’ye tekrar doğrult.','Adres http:// veya https:// ile başlamalı','Sunucu, kullanıcı adı ve şifreyi doldur.','Kodun süresi doldu. TV’de QR kodunu yeniden aç.','Tamam. TV şimdi listeyi yüklüyor.'],
    hi: ['टीवी में प्लेलिस्ट जोड़ें','जानकारी सिर्फ़ होम नेटवर्क पर आपके टीवी को जाती है।','M3U लिंक','नाम','प्लेलिस्ट पता (M3U)','उपयोगकर्ता नाम','पासवर्ड','कार्यक्रम सूची EPG (वैकल्पिक)','टीवी पर भेजें','मेरा IPTV','यह कोड OnAir ऐप के लिए है','फ़ोन पर OnAir खोलें: सेटिंग्स → दूसरे डिवाइस पर भेजें → QR कोड स्कैन करें, और फिर से टीवी की ओर करें।','पता http:// या https:// से शुरू होना चाहिए','सर्वर, उपयोगकर्ता नाम और पासवर्ड भरें।','कोड की समय-सीमा खत्म। टीवी पर QR कोड फिर से खोलें।','हो गया। टीवी अब प्लेलिस्ट लोड कर रहा है।'],
    zh: ['向电视添加播放列表','信息只会发送到你家庭网络中的电视。','M3U 链接','名称','播放列表地址（M3U）','用户名','密码','节目单 EPG（可选）','发送到电视','我的 IPTV','此二维码需在 OnAir 应用中打开','在手机上打开 OnAir：设置 → 传输到其他设备 → 扫描二维码，然后再次对准电视。','地址必须以 http:// 或 https:// 开头','请填写服务器、用户名和密码。','二维码已过期。请在电视上重新打开二维码。','完成。电视正在加载播放列表。'],
    ja: ['テレビにプレイリストを追加','情報は家庭内ネットワークのテレビにのみ送信されます。','M3U リンク','名前','プレイリストのアドレス（M3U）','ユーザー名','パスワード','番組表 EPG（任意）','テレビに送信','マイ IPTV','このコードは OnAir アプリで読み取ってください','スマホで OnAir を開き：設定 → 別のデバイスに転送 → QR コードをスキャン で、もう一度テレビに向けてください。','アドレスは http:// または https:// で始まる必要があります','サーバー、ユーザー名、パスワードを入力してください。','コードの有効期限が切れました。テレビで QR コードをもう一度開いてください。','完了。テレビがプレイリストを読み込んでいます。'],
    id: ['Tambah playlist ke TV','Data hanya dikirim ke TV-mu di jaringan rumah.','Tautan M3U','Nama','Alamat playlist (M3U)','Nama pengguna','Kata sandi','Jadwal acara EPG (opsional)','Kirim ke TV','IPTV-ku','Kode ini untuk aplikasi OnAir','Di ponsel buka OnAir: Pengaturan → Transfer ke perangkat lain → Pindai kode QR, lalu arahkan lagi ke TV.','Alamat harus diawali http:// atau https://','Isi server, nama pengguna, dan kata sandi.','Kode kedaluwarsa. Buka lagi kode QR di TV.','Selesai. TV sedang memuat playlist.']
  };
  const lang = [...(navigator.languages || []), navigator.language || ''].map(l => String(l).slice(0, 2).toLowerCase()).find(l => L[l]) || 'en';
  const T = Object.fromEntries(K.map((k, i) => [k, L[lang][i]]));
  document.documentElement.lang = lang; document.title = 'OnAir – ' + T.title;
  document.querySelectorAll('[data-t]').forEach(e => { e.textContent = T[e.dataset.t]; });
  document.getElementById('name').placeholder = T.ph;
  // A code for moving channels between two OnAir apps: it belongs in the app, not in the phone's browser.
  if (new URLSearchParams(location.search).get('m') === 's') {
    document.querySelector('h1').textContent = T.sTitle;
    document.querySelector('[data-t=lead]').textContent = T.sLead;
    document.querySelector('.seg').hidden = true; document.getElementById('f').hidden = true;
  }
  const say = (m, err) => { const e = document.getElementById('msg'); e.textContent = m; e.className = 'msg on' + (err ? ' err' : ''); };
  let type = 'm3u';
  document.querySelectorAll('.seg button').forEach(b => b.onclick = () => {
    type = b.dataset.v;
    document.querySelectorAll('.seg button').forEach(x => x.classList.toggle('on', x === b));
    document.getElementById('m3u').hidden = type !== 'm3u'; document.getElementById('xt').hidden = type === 'm3u';
  });
  const v = id => document.getElementById(id).value.trim();
  document.getElementById('f').onsubmit = async e => {
    e.preventDefault();
    const data = { name: v('name'), epg: v('epg') };
    if (type === 'm3u') { data.m3u = v('url'); if (!/^https?:\/\//i.test(data.m3u)) return say(T.eUrl, true); }
    else { data.server = v('server'); data.user = v('user'); data.pass = document.getElementById('pass').value; if (!data.server || !data.user || !data.pass) return say(T.eXt, true); }
    document.getElementById('go').disabled = true;
    try {
      const r = await fetch(location.pathname + location.search, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(data) });
      if (!r.ok) throw new Error(r.status === 403 ? T.eExp : 'HTTP ' + r.status);
      say(T.done);
    } catch (err) { say(err.message, true); document.getElementById('go').disabled = false; }
  };
</script>
</body>
</html>
